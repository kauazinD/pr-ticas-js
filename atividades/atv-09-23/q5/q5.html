<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 5</title>
    <script src="./q5.js" defer></script>
</head>
<body>
    <h1>Questão 5</h1>
    <p>Escreva um programa que calcule o salário de um professor baseado no valor da hora-aula e da quantidade de
horas trabalhadas, obtidas a partir do teclado.</p>
    <form id="formDados">
      <label for="valorHora">Valor da hora-aula: </label>
      <input type="number" step="0.01" id="valorHora"/>

      <label for="quantidadeHoras">Quantidade de horas trabalhadas: </label>
      <input type="number" step="0.01" id="quantidadeHoras"/>

      <button type="submit">Calcular Salário</button>
    </form>
    <p id="resultado"></p>
</body>
</html>
