<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 4</title>
    <script src="./q4.js" defer></script>

<body>
    <h1>Questão 4</h1>
    <p>Escreva um programa que calcule o perímetro (circunferência) de um círculo a partir do valor do raio.</p>
    <form id="formDados">
      <label for="raio">Valor do raio: </label>
      <input type="number" step="0.01" id="raio"/>

      <button type="submit">Calcular Perímetro</button>
    </form>
    <p id="resultado"></p>
</body>
